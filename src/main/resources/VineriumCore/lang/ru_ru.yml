  ping_alert_message: "Обнаружен высокий средний пинг: {1}!"
  guide_possible_message: '<gradient:#E95AA7:#AF4FE9><bold>Рады видеть тебя на Vinerium!</bold><newline><gradient:#a2e87d:#44ff00>Первые минуты на новом сервере бывают непростыми, но ты не один! Если хочешь быстрее во всём разобраться и влиться в игру, вводи команду <gold><u><click:run_command:"/vin guide"><hover:show_text:"<gold>Нажмите, чтобы применить...</gold>">/экскурсия</hover></click></u></gold>.<newline><gradient:#a2e87d:#44ff00>Наши хелперы, которые находятся в сети, с радостью уделят тебе время, всё покажут, расскажут про правила и фишки, а также ответят на любые вопросы.<newline><gradient:#a2e87d:#44ff00>Рекомендуем заранее установить <gradient:#E95AA7:#AF4FE9>Plasmo Voice</gradient>, чтобы экскурсы прошла легче и интереснее.'
