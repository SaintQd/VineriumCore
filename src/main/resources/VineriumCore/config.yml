PvPMode:
  Enabled: true
  Placeholder: '⚔ '
  MinRadiusWithoutPlayers: 50
TimersCooldown:
  entityNotEnabledPvp: 200
  damagerNotEnabledPvp: 200
  pvpToggleCooldown: 6000
RepairCostFix:
  Enabled: true
  Force: false
DiscordSRV:
  MessageFormats:
    donate_purchase_message:
      Webhook:
        Enabled: false
        AvatarUrl: '%botavatarurl%'
        Name: '%botname%'
      Content: ''
      Embed:
        Enabled: true
        Color: '#999900'
        Author:
          ImageUrl: '%embedavatarurl%'
          Name: ᴩᴜʀᴄʜᴀꜱᴇ
          Url: ''
        ThumbnailUrl: ''
        Title:
          Text: ''
          Url: ''
