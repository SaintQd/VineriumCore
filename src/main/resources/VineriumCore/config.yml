Tweaks:
  RepairCostFix:
    Enabled: true
    Force: false
  GrindstoneDisenchant: true
  AgeLock:
    Enabled: true
    Item: POISONOUS_POTATO
    RemoveItem: true
  VillagerOptimizer:
    Enabled: true
    DisableUnoptimizedTrades: true
    InteractMaterial: SHEARS
    RestockInterval: 1000
    RestockSound: entity.villager.celebrate
    InteractSound: entity.villager.hurt
    InjectTradesOnOptimize:
      minecraft:toolsmith:
        - 'EMERALD:1,AIR:1,IRON_INGOT:4'
  VillagerManualBreed:
    Enabled: true
    Cooldown: 1200
    Items:
      BREAD: 6
      CARROT: 24
      POTATO: 24
      BEETROOT: 24
  CopperGolem:
    Enabled: true
    InteractMaterials:
      - REDSTONE_TORCH
      - END_ROD
    InteractSound: entity.iron_golem.repair
    MaxPerPlayer: 2
    MaxPerChest: 1
  AnvilRepair:
    Enabled: true
    RepairMaterial: IRON_BLOCK
    RepairSound: entity.iron_golem.repair
  PortalRedirect:
    Enabled: false
    Worlds:
      test:
        Commands:
          - 'cmi tppos %player_name% 100.0 100.0 100.0'
  MaceDenier:
    Enabled: false
    CustomNames:
      - 'Элдрик, Главный кузнец Незера'
  ItemLock:
    Enabled: true
    Materials:
      - 'NETHERITE_UPGRADE_SMITHING_TEMPLATE'
      - 'FILLED_MAP'
Compatibility:
  LiteBans:
    Enabled: true
    CommandsOnBan:
      - 'vindiscord addrole %player_name% 1307640043975737434'
      - 'vindiscord removerole %player_name% 727633442950479873'
    CommandsOnTempBan:
      - 'vindiscord addrole %player_name% 1307640043975737434 %time%ms'
      - 'vindiscord removerole %player_name% 727633442950479873 %time%ms'
    CommandsOnUnban:
      - 'vindiscord addrole %player_name% 727633442950479873'
      - 'vindiscord removerole %player_name% 1307640043975737434'
    CommandsOnMute: []
    CommandsOnTempMute: []
    CommandsOnUnmute: []
  LuckPerms:
    Enabled: true
    VipGroupName: 'vip'
AccountTransfer:
