Language: ru_ru
Messages:
  Enabled: true
  Join:
    Enabled: true
    Format: ' <gradient:#EF97D1:#AA68F6>[+] • [message]'
  DefaultJoin:
    Enabled: true
    Format: ' <gradient:#EF97D1:#AA68F6>[+] • * зашёл поиграть'
  Leave:
    Enabled: true
    Format: ' <gradient:#AFF5FF:#E7A6FF>[-] • [message]'
  DefaultLeave:
    Enabled: true
    Format: ' <gradient:#AFF5FF:#E7A6FF>[-] • * вышел из игры'
  FirstJoin:
    Enabled: true
    Format: ' <#82ECB4>[❤] • * впервые на сервере'
  MaxLength: 100
  NicknameFormat: '%player_name% <white>%luckperms_suffix%</white>'
  RightClickNickname:
    Enabled: true
    HideInvisible: true
    SneakingAllowed: false
    AlwaysShowGamemodes:
      - 'CREATIVE'
      - 'SPECTATOR'
    Format: '%luckperms_prefix%*'
  Death:
    Enabled: true
    Format: '<#E02626>[<white>ꐜ</white>] •</#E02626> <#D25454>*'
    PlayerName: '<gold>* <white>%luckperms_suffix%</white></gold>'
  Advancement:
    Enabled: true
    Format: '<#9D41E0>[<light_purple>⚝</light_purple>] •</#9D41E0> <#8ED9E3>*'
    PlayerName: '<gold>* <white>%luckperms_suffix%</white></gold>'
    ShowTypes:
      - CHALLENGE
    AlwaysShowNamespaces:
      - 'minecraft'
VillagerOptimizer:
  Enabled: true
  DisableUnoptimizedTrades: true
  InteractMaterial: SHEARS
  RestockInterval: 1000
  RestockSound: entity.villager.celebrate
  InteractSound: entity.villager.hurt
